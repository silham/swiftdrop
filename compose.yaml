# SwiftDrop dev stack — `make up` (or `docker compose up -d`). Owner: M10.
# Browser entry point: http://localhost:8080 (Caddy gateway → web + /api).
name: swiftdrop

x-node: &node # built once by the `deps` service; every Node service reuses the same dev image
  image: swiftdrop-dev:local
  pull_policy: never
  env_file: .env
  working_dir: /app
  volumes: &node-volumes
    - .:/app
    - pnpm-store:/pnpm-store
    - nm-root:/app/node_modules
    - nm-api:/app/apps/api/node_modules
    - nm-worker:/app/apps/worker/node_modules
    - nm-web:/app/apps/web/node_modules
    - nm-e2e:/app/apps/e2e/node_modules
    - nm-contracts:/app/packages/contracts/node_modules
    - nm-db:/app/packages/db/node_modules
    - web-next:/app/apps/web/.next

services:
  # ── one-shot setup ──────────────────────────────────────────────────────────
  deps:
    <<: *node
    build: { context: ., dockerfile: docker/Dockerfile, target: dev }
    pull_policy: build
    command: sh -c "pnpm install --frozen-lockfile && pnpm build:packages"
    restart: 'no'

  migrate:
    <<: *node
    command: sh -c "pnpm --filter @swiftdrop/db migrate:deploy && pnpm --filter @swiftdrop/db seed"
    restart: 'no'
    depends_on:
      deps: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }

  # ── applications ───────────────────────────────────────────────────────────
  api:
    <<: *node
    command: pnpm --filter @swiftdrop/api dev
    ports: ['4000:4000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    <<: *node
    command: pnpm --filter @swiftdrop/worker dev
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    <<: *node
    command: pnpm --filter @swiftdrop/web dev
    ports: ['3000:3000']
    depends_on:
      deps: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 40s

  gateway:
    image: caddy:2.10-alpine
    ports: ['8080:80']
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [api, web]

  # ── e2e (only with `--profile e2e`, see `make e2e`) ────────────────────────
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: [e2e]
    working_dir: /app
    environment:
      E2E_BASE_URL: http://gateway
      MAILPIT_URL: http://mailpit:8025
      CI: 'true'
    volumes: *node-volumes
    command: sh -c "npm i -g pnpm@12.14.0 >/dev/null && pnpm --filter @swiftdrop/e2e test:e2e"
    depends_on:
      gateway: { condition: service_started }
      mailpit: { condition: service_started }
      api: { condition: service_healthy }
      web: { condition: service_healthy }

  # ── infrastructure ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: swiftdrop
      POSTGRES_PASSWORD: swiftdrop
      POSTGRES_DB: swiftdrop
    ports: ['5432:5432']
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swiftdrop -d swiftdrop']
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: swiftdrop
      RABBITMQ_DEFAULT_PASS: swiftdrop
    ports: ['5672:5672', '15672:15672']
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['8025:8025', '1025:1025']

  # S3-compatible object storage (RustFS — MinIO-compatible API; the `minio` npm client talks to it).
  # Console: http://localhost:9001 (swiftdrop / swiftdrop-secret)
  minio:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: swiftdrop
      RUSTFS_SECRET_KEY: swiftdrop-secret
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports: ['9000:9000', '9001:9001']
    volumes: [minio-data:/data]
    healthcheck:
      test: ['CMD-SHELL', 'curl -s -o /dev/null http://localhost:9000/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pg-data:
  rabbitmq-data:
  minio-data:
  pnpm-store:
  nm-root:
  nm-api:
  nm-worker:
  nm-web:
  nm-e2e:
  nm-contracts:
  nm-db:
  web-next:
