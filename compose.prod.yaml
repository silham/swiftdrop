# Production-like stack from the prod Dockerfile targets (no bind mounts, no hot reload).
# `make prod-up`. Owner: M10 (finalise in Week 8; Kubernetes is a P2 stretch goal).
# Uses the same .env — for a real deployment use fresh secrets. NODE_ENV=production,
# ENABLE_DEV_LOGIN=false and COOKIE_SECURE=true are set below (they override .env).
# Secure cookies are only sent over HTTPS (Chrome and Firefox also allow http://localhost, Safari does
# not). To try the prod stack in Safari over plain HTTP:  PROD_COOKIE_SECURE=false make prod-up
name: swiftdrop-prod

x-app-env: &app-env
  NODE_ENV: production
  COOKIE_SECURE: ${PROD_COOKIE_SECURE:-true}
  ENABLE_DEV_LOGIN: 'false'
  NEXT_PUBLIC_ENABLE_DEV_LOGIN: 'false'

x-app: &app
  env_file: .env
  environment: *app-env
  restart: unless-stopped

services:
  migrate:
    <<: *app
    build: { context: ., dockerfile: docker/Dockerfile, target: migrate }
    restart: 'no'
    depends_on: { postgres: { condition: service_healthy } }

  api:
    <<: *app
    build: { context: ., dockerfile: docker/Dockerfile, target: api }
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  worker:
    <<: *app
    build: { context: ., dockerfile: docker/Dockerfile, target: worker }
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  web:
    <<: *app
    # .env sets PORT=4000 for the API; the Next.js server reads PORT too, and the gateway expects 3000.
    environment:
      <<: *app-env
      PORT: '3000'
    build: { context: ., dockerfile: docker/Dockerfile, target: web }
    depends_on: [api]

  gateway:
    image: caddy:2.10-alpine
    ports: ['8080:80']
    volumes: ['./docker/Caddyfile:/etc/caddy/Caddyfile:ro']
    depends_on: [api, web]

  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: swiftdrop, POSTGRES_PASSWORD: swiftdrop, POSTGRES_DB: swiftdrop }
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swiftdrop -d swiftdrop']
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment: { RABBITMQ_DEFAULT_USER: swiftdrop, RABBITMQ_DEFAULT_PASS: swiftdrop }
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.27

  minio:
    image: rustfs/rustfs:1.0.3
    environment: { RUSTFS_ACCESS_KEY: swiftdrop, RUSTFS_SECRET_KEY: swiftdrop-secret }
    volumes: [minio-data:/data]

volumes:
  pg-data:
  minio-data:
