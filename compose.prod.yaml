# Production-like stack from the prod Dockerfile targets (no bind mounts, no hot reload).
# Owner: M10. Locally: `make prod-up` (reads .env). On a server (Coolify, see docs/deploy/coolify.md)
# set the variables below in the platform; every one the app needs is listed explicitly here, so it
# does not depend on a .env file. ${VAR:?…} = required, ${VAR:-x} = default x.
# Secure cookies are only sent over HTTPS (Chrome and Firefox also allow http://localhost, Safari does
# not). To try the prod stack in Safari over plain HTTP:  PROD_COOKIE_SECURE=false make prod-up
# Kubernetes: deploy/helm/swiftdrop (docs/deploy/kubernetes.md).
name: swiftdrop-prod

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_URL: ${APP_URL:-http://localhost:8080}
  CORS_ORIGINS: ${PROD_CORS_ORIGINS:-${APP_URL:-http://localhost:8080}}
  DATABASE_URL: postgresql://swiftdrop:${POSTGRES_PASSWORD:-swiftdrop}@postgres:5432/swiftdrop
  RABBITMQ_URL: amqp://swiftdrop:${RABBITMQ_PASSWORD:-swiftdrop}@rabbitmq:5672
  WEBHOOK_SECRET_ENC_KEY: ${WEBHOOK_SECRET_ENC_KEY:?set WEBHOOK_SECRET_ENC_KEY (openssl rand -base64 32)}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET (openssl rand -hex 32)}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET (openssl rand -hex 32)}
  JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
  JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
  JWT_ISSUER: ${JWT_ISSUER:-swiftdrop-api}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-swiftdrop-web}
  COOKIE_SECURE: ${PROD_COOKIE_SECURE:-true}
  ENABLE_DEV_LOGIN: 'false'
  NEXT_PUBLIC_ENABLE_DEV_LOGIN: 'false'
  THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
  THROTTLE_LIMIT: ${THROTTLE_LIMIT:-300}
  # proxies in front of the API: Caddy gateway = 1; Coolify's Traefik + Caddy = 2
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_CALLBACK_URL: ${APP_URL:-http://localhost:8080}/api/v1/auth/google/callback
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  S3_ENDPOINT: minio
  S3_PORT: '9000'
  S3_USE_SSL: 'false'
  S3_ACCESS_KEY: swiftdrop
  S3_SECRET_KEY: ${STORAGE_SECRET_KEY:-swiftdrop-secret}
  S3_BUCKET_POD: proof-of-delivery
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  MAIL_FROM: ${MAIL_FROM:-SwiftDrop <no-reply@swiftdrop.test>}
  SMS_PROVIDER: ${SMS_PROVIDER:-log}
  API_INTERNAL_URL: http://api:4000

x-app: &app
  environment: *app-env
  restart: unless-stopped

services:
  # Applies migrations; with RUN_SEED=true it also loads the demo accounts and data (idempotent).
  migrate:
    <<: *app
    build: { context: ., dockerfile: docker/Dockerfile, target: migrate }
    command:
      [
        'sh',
        '-c',
        'pnpm exec prisma migrate deploy && if [ "$$RUN_SEED" = "true" ]; then pnpm seed; fi',
      ]
    environment:
      <<: *app-env
      RUN_SEED: ${RUN_SEED:-false}
    restart: 'no'
    depends_on: { postgres: { condition: service_healthy } }

  api:
    <<: *app
    environment:
      <<: *app-env
      PORT: '4000'
    build: { context: ., dockerfile: docker/Dockerfile, target: api }
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  worker:
    <<: *app
    build: { context: ., dockerfile: docker/Dockerfile, target: worker }
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  web:
    <<: *app
    environment:
      <<: *app-env
      PORT: '3000'
    build: { context: ., dockerfile: docker/Dockerfile, target: web }
    depends_on: [api]

  # Single public entry (Caddy): /api, /mcp and OAuth discovery → api, everything else → web.
  # On Coolify, attach the domain to this service (port 80).
  gateway:
    image: caddy:2.10-alpine
    ports: ['${GATEWAY_PORT:-8080}:80']
    volumes: ['./docker/Caddyfile:/etc/caddy/Caddyfile:ro']
    depends_on: [api, web]
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: swiftdrop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swiftdrop}
      POSTGRES_DB: swiftdrop
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swiftdrop -d swiftdrop']
      interval: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: swiftdrop
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-swiftdrop}
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      retries: 12
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped

  minio:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: swiftdrop
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-swiftdrop-secret}
    volumes: [minio-data:/data]
    restart: unless-stopped

volumes:
  pg-data:
  minio-data:
