# CI — every PR to main must pass. Owner: M10.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://swiftdrop:swiftdrop@localhost:5432/swiftdrop
  SHADOW_DATABASE_URL: postgresql://swiftdrop:swiftdrop@localhost:5432/swiftdrop_shadow
  TEST_DATABASE_URL: postgresql://swiftdrop:swiftdrop@localhost:5432/swiftdrop_test
  RABBITMQ_URL: amqp://swiftdrop:swiftdrop@localhost:5672
  JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789
  JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef0123456789
  S3_ENDPOINT: localhost
  S3_ACCESS_KEY: ci
  S3_SECRET_KEY: ci-secret-key
  WEBHOOK_SECRET_ENC_KEY: Y2ktb25seS13ZWJob29rLWtleS0zMi1ieXRlcyEhISE=
  ENABLE_DEV_LOGIN: 'true'

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: swiftdrop, POSTGRES_PASSWORD: swiftdrop, POSTGRES_DB: swiftdrop }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U swiftdrop" --health-interval 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.1-alpine
        env: { RABBITMQ_DEFAULT_USER: swiftdrop, RABBITMQ_DEFAULT_PASS: swiftdrop }
        ports: ['5672:5672']
      # S3-compatible storage for the proof-of-delivery tests (the API creates the bucket itself)
      minio:
        image: rustfs/rustfs:1.0.3
        env: { RUSTFS_ACCESS_KEY: ci, RUSTFS_SECRET_KEY: ci-secret-key }
        ports: ['9000:9000']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Create test + shadow databases
        run: |
          PGPASSWORD=swiftdrop psql -h localhost -U swiftdrop -c "CREATE DATABASE swiftdrop_test;"
          PGPASSWORD=swiftdrop psql -h localhost -U swiftdrop -c "CREATE DATABASE swiftdrop_shadow;"
      - name: Wait for object storage
        run: timeout 60 bash -c 'until curl -s -o /dev/null http://localhost:9000; do sleep 2; done'
      - run: pnpm build:packages
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Prisma drift check (schema files == migrations)
        run: pnpm --filter @swiftdrop/db migrate:diff
      # Worker + contracts unit tests with coverage, and the web unit tests.
      - run: pnpm --filter @swiftdrop/worker --filter @swiftdrop/contracts test:cov
      - run: pnpm --filter @swiftdrop/web test
      # API unit + integration tests in one run: one merged report, minimum coverage enforced.
      - run: pnpm --filter @swiftdrop/api test:cov:all
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            apps/api/coverage/merged
            apps/worker/coverage
            packages/contracts/coverage

  e2e:
    # Full docker stack + Playwright. Runs on main and on PRs labelled `e2e`.
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 600 gateway api web worker
      - run: docker compose --profile e2e run --rm e2e
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright
          path: |
            apps/e2e/playwright-report
            compose.log
