{{- /*
Secrets: connection strings, signing keys, API keys. Values left empty in values.yaml are generated on
first install and re-used on upgrade (lookup), so sessions and encrypted webhook secrets survive.
Skipped when existingSecret is set; that Secret needs the same keys.
*/ -}}
{{- if not .Values.existingSecret }}
{{- $name := include "swiftdrop.secretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $pg := include "swiftdrop.secretValue" (dict "root" . "old" $old "key" "postgresPassword" "stored" "POSTGRES_PASSWORD" "generate" (randAlphaNum 24)) }}
{{- $mq := include "swiftdrop.secretValue" (dict "root" . "old" $old "key" "rabbitmqPassword" "stored" "RABBITMQ_DEFAULT_PASS" "generate" (randAlphaNum 24)) }}
{{- $s3 := include "swiftdrop.secretValue" (dict "root" . "old" $old "key" "storageSecretKey" "stored" "S3_SECRET_KEY" "generate" (randAlphaNum 32)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "swiftdrop.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pg | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s" .Values.postgres.user $pg (include "swiftdrop.host" (list . "postgres")) .Values.postgres.database | quote }}
  RABBITMQ_DEFAULT_PASS: {{ $mq | quote }}
  RABBITMQ_URL: {{ printf "amqp://%s:%s@%s:5672" .Values.rabbitmq.user $mq (include "swiftdrop.host" (list . "rabbitmq")) | quote }}
  S3_SECRET_KEY: {{ $s3 | quote }}
  JWT_ACCESS_SECRET: {{ include "swiftdrop.secretValue" (dict "root" . "old" $old "key" "JWT_ACCESS_SECRET" "stored" "JWT_ACCESS_SECRET" "generate" (randAlphaNum 48)) | quote }}
  JWT_REFRESH_SECRET: {{ include "swiftdrop.secretValue" (dict "root" . "old" $old "key" "JWT_REFRESH_SECRET" "stored" "JWT_REFRESH_SECRET" "generate" (randAlphaNum 48)) | quote }}
  WEBHOOK_SECRET_ENC_KEY: {{ include "swiftdrop.secretValue" (dict "root" . "old" $old "key" "WEBHOOK_SECRET_ENC_KEY" "stored" "WEBHOOK_SECRET_ENC_KEY" "generate" (randAlphaNum 32 | b64enc)) | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.GOOGLE_CLIENT_SECRET | quote }}
  LLM_API_KEY: {{ .Values.secrets.LLM_API_KEY | quote }}
{{- end }}
