{{- $name := include "swiftdrop.host" (list . "web") }}
# Next.js web app (standalone server). Server components call the API through its Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "swiftdrop.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {{- include "swiftdrop.selector" (list . "web") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "swiftdrop.selector" (list . "web") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "swiftdrop.image" (list . "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom: {{- include "swiftdrop.envFrom" . | nindent 12 }}
          env:
            - { name: PORT, value: '3000' }
            - { name: HOSTNAME, value: 0.0.0.0 }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext: {{- include "swiftdrop.appSecurityContext" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "swiftdrop.labels" . | nindent 4 }}
spec:
  selector: {{- include "swiftdrop.selector" (list . "web") | nindent 4 }}
  ports:
    - { name: http, port: 3000, targetPort: http }
